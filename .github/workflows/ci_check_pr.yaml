name: CI Checks on PRs

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Disable incremental compilation.
    #
    # Incremental compilation is useful as part of an edit-build-test-edit cycle,
    # as it lets the compiler avoid recompiling code that hasn't changed. However,
    # on CI, we're not making small edits; we're almost always building the entire
    # project from scratch. Thus, incremental compilation on CI actually
    # introduces *additional* overhead to support making future builds
    # faster...but no future builds will ever occur in any given CI environment.
    #
    # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
    # for details.
    CARGO_INCREMENTAL: 0
    # Allow more retries for network requests in cargo (downloading crates) and
    # rustup (installing toolchains). This should help to reduce flaky CI failures
    # from transient network timeouts or other issues.
    CARGO_NET_RETRY: 10
    RUSTUP_MAX_RETRIES: 10
    # Don't emit giant backtraces in the CI logs.
    RUST_BACKTRACE: short
    # Use cargo's sparse index protocol
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_SESSION_TOKEN: test
    AWS_REGION: ap-south-1
    APP_ENV: "TEST"

jobs:
    formatting:
        name: Check formatting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Restore cache (if present)
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              id: cache-restore
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-test-

            - name: Install Rust
              run: rustup toolchain install

            - name: Install leptosfmt
              uses: baptiste0928/cargo-install@21a18ba3bf4a184d1804e8b759930d3471b1c941 # v2.2.0
              with:
                  crate: leptosfmt
                  version: "0.1.33"

            - name: Check formatting & linting
              shell: bash
              run: make check

            - name: install cocogitto
              uses: baptiste0928/cargo-install@21a18ba3bf4a184d1804e8b759930d3471b1c941 # v2.2.0
              with:
                  crate: cocogitto
                  version: "6.2.0"

            - name: Check conventional commit
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    git config --global user.name "${{ github.event.pull_request.user.login }}"
                    commit=$(git log --format=%B -n 1 ${{ github.event.pull_request.head.sha }})
                  else
                    git config --global user.name "${{ github.event.pusher.name }}"
                    commit=$(git log --format=%B -n 1 ${{ github.sha }})
                  fi
                  git config --global user.email "temp_email@juspay.in"
                  cog verify "$commit"

    test:
        name: Testing
        runs-on: ubuntu-latest
        services:
            postgres:
                image: public.ecr.aws/docker/library/postgres:17.11-alpine
                ports:
                    - 5432:5432
                env:
                    POSTGRES_PASSWORD: "docker"
                    POSTGRES_DB: "config"
            redis:
                image: public.ecr.aws/docker/library/redis:8.10.3
                ports:
                    - 6379:6379

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Restore cache (if present)
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              id: cache-restore
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-test-

            - name: Install postgres libs
              run: |
                  sudo apt update
                  sudo apt-get -y install postgresql libpq-dev libgmp-dev

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4

            - name: Install Rust
              run: rustup toolchain install

            - name: install node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 26.13.0

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
              with:
                  version: v0.15.1

            - name: Set up JDK
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  java-version: "17.0.19"
                  distribution: "zulu"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

            - name: Setup Haskell environment (GHC and Cabal)
              uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
              with:
                  ghc-version: "9.6.7" # Specify the GHC version (e.g., '9.2' or 'latest')
                  cabal-version: "3.16.1.0" # Specify the Cabal version (e.g., '3.8' or 'latest')

            - name: Update Cabal package database
              run: cabal update

            - name: run tests
              shell: bash
              run: |
                  make test CI=1
              env:
                  APP_ENV: "TEST"

            - name: save/update cache for future runs
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              id: cache-save
              if: github.ref == 'refs/heads/main'
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

    java-build:
        name: Java build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: clients/java

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Restore cache (if present)
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Set up JDK 17
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  java-version: "17.0.19"
                  distribution: "zulu"

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Run Gradle assemble
              run: ./gradlew assemble

            ## This requires more setup. Specifically, we need the server to be up w/
            ## some dummy data.
            # - name: Run tests
            #   run: ./gradlew test

            - name: save/update cache for future runs
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              if: github.ref == 'refs/heads/main'
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

            - name: Upload build artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: build-reports
                  path: |
                      build/reports/
                      build/test-results/
                  retention-days: 7

    provider-tests:
        name: Provider Tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                provider:
                    - kotlin
                    - js
                    - py
                    - rust
                    - hs
        services:
            postgres:
                image: public.ecr.aws/docker/library/postgres:17.11-alpine
                ports:
                    - 5432:5432
                env:
                    POSTGRES_PASSWORD: "docker"
                    POSTGRES_DB: "config"
            redis:
                image: public.ecr.aws/docker/library/redis:8.10.3
                ports:
                    - 6379:6379

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Install postgres libs
              run: |
                  sudo apt update
                  sudo apt-get -y install postgresql libpq-dev libgmp-dev zlib1g-dev

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4

            - name: make binary executable
              run: chmod +x scripts/setup_provider_binaries.sh

            - name: Restore cache (if present)
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              id: cache-restore
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-test-

            - name: Install Rust
              run: rustup toolchain install

            - name: Set up JDK 17 (for Kotlin tests)
              if: matrix.provider == 'kotlin'
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  java-version: "17.0.19"
                  distribution: "zulu"

            - name: Make gradlew executable
              if: matrix.provider == 'kotlin'
              run: chmod +x clients/java/gradlew

            - name: Run Gradle assemble
              if: matrix.provider == 'kotlin'
              run: cd clients/java && ./gradlew assemble

            - name: Install Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 26.13.0

            - name: Set up Python (for Python tests)
              if: matrix.provider == 'py'
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.12.16"

            - name: Install uv
              if: matrix.provider == 'py'
              uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
              with:
                  version: "0.13.7"

            - name: Setup Haskell environment (GHC and Cabal)
              if: matrix.provider == 'hs'
              uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
              with:
                  ghc-version: "9.6.7" # Specify the GHC version (e.g., '9.2' or 'latest')
                  cabal-version: "3.16.1.0" # Specify the Cabal version (e.g., '3.8' or 'latest')

            - name: Run provider tests
              shell: bash
              run: |
                  cargo build --package superposition_core
                  export UV_PROJECT_ENVIRONMENT="${pythonLocation}"
                  echo "UV_PROJECT_ENVIRONMENT: $UV_PROJECT_ENVIRONMENT"
                  make test-${{ matrix.provider }}-provider
              env:
                  APP_ENV: "TEST"

    binding-generation-check:
        name: Check generation of uniffi bindings
        # runs-on: codebuild-superposition-${{ github.run_id }}-${{ github.run_attempt }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Install Rust
              run: rustup toolchain install

            - name: Generate bindings
              run: |
                  make uniffi-bindings

            - name: Ensure no file changed
              run: |
                  git add .
                  git diff --staged --exit-code

            - name: Show git diff on failure
              if: failure()
              run: |
                  echo "❌ The following files were modified:"
                  git diff --staged --name-only
                  exit 1

    smithy-sdk-generation-check:
        name: Check generation of sdk from smithy models
        # runs-on: codebuild-superposition-${{ github.run_id }}-${{ github.run_attempt }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Install Smithy CLI
              run: |
                  curl -sSL https://github.com/smithy-lang/smithy/releases/download/1.69.0/smithy-cli-linux-x86_64.zip -o "$RUNNER_TEMP/smithy.zip"
                  echo "45db1e239c0aa5fce6706676701c9e4ed09e67cd231222762207dcf384c9ea4e  $RUNNER_TEMP/smithy.zip" | sha256sum -c -
                  unzip -qo "$RUNNER_TEMP/smithy.zip" -d "$RUNNER_TEMP"
                  "$RUNNER_TEMP/smithy-cli-linux-x86_64/install" -i "$RUNNER_TEMP/smithy" -b "$RUNNER_TEMP/smithy/bin"
                  echo "$RUNNER_TEMP/smithy/bin" >> "$GITHUB_PATH"

            - name: Generate SDKs
              run: |
                  make smithy-updates

            - name: Ensure no unwanted file changes
              run: |
                  git add .
                  git diff --staged --exit-code -- \
                    . \
                    ':(exclude)**/*.api.mdx' \
                    ':(exclude)clients/java/sdk/src/main/java/io/juspay/superposition/client/SuperpositionAsyncClientImpl.java' \
                    ':(exclude)clients/java/sdk/src/main/java/io/juspay/superposition/client/SuperpositionAsyncClient.java' \
                    ':(exclude)clients/java/sdk/src/main/java/io/juspay/superposition/client/SuperpositionClient.java' \
                    ':(exclude)clients/java/sdk/src/main/java/io/juspay/superposition/client/SuperpositionClientImpl.java' \
                    ':(exclude)clients/java/sdk/src/main/java/io/juspay/superposition/model/BulkOperation.java' \
                    ':(exclude)clients/haskell/sdk/Io/Superposition/Command/BulkOperation.hs' \
                    ':(exclude)clients/haskell/sdk/Io/Superposition/Command/WeightRecompute.hs' \
                    ':(exclude)clients/python/sdk/superposition_sdk/deserialize.py' \
                    ':(exclude)clients/python/sdk/superposition_sdk/models.py'
                  git diff --staged -I '^api:' --exit-code -- '**/*.api.mdx'

            - name: Show git diff on failure
              if: failure()
              run: |
                  echo "❌ The following files were modified:"
                  git diff --staged --name-only
                  exit 1

            # on failure, create a commit of the modified files for easier debugging
            # to enable this, make sure to update the workflow permissions at the top of this file to include
            # 'contents: write'
            # - name: Commit modified files for debugging
            #   if: failure()
            #   run: |
            #       git config --global user.name "github-actions"
            #       git config --global user.email "github-actions@github.com"
            #       git add -A
            #       git commit -m "Debug: Commit modified files from generation-tests job"
            #       git push origin HEAD:refs/heads/debug/${{ github.run_id }}-${{ github.run_attempt }} --force
