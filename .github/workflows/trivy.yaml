name: Trivy Security Scan

permissions:
    contents: read

on:
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    trivy-scan:
        name: Trivy vulnerability scan
        runs-on: anton1
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Trivy
              shell: bash
              run: |
                  curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/.local/bin" v0.76.0
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Scan repository dependencies (CRITICAL/HIGH gate)
              shell: bash
              run: |
                  trivy fs \
                    --scanners vuln \
                    --severity CRITICAL,HIGH \
                    --exit-code 1 \
                    --ignorefile .trivyignore.yaml \
                    --skip-dirs node_modules \
                    --skip-dirs target \
                    --skip-dirs .direnv \
                    .

            - name: Build superposition image
              shell: bash
              run: docker build -t "superposition:pr-${{ github.sha }}" .

            - name: Scan superposition image (CRITICAL/HIGH gate)
              shell: bash
              run: |
                  trivy image \
                    --scanners vuln \
                    --severity CRITICAL,HIGH \
                    --exit-code 1 \
                    --ignorefile .trivyignore.yaml \
                    "superposition:pr-${{ github.sha }}"

            - name: Build superposition-demo image
              shell: bash
              run: |
                  docker build \
                    -f example.Dockerfile \
                    --build-arg "SUPERPOSITION_BASE=superposition:pr-${{ github.sha }}" \
                    -t "superposition-demo:pr-${{ github.sha }}" .

            - name: Scan superposition-demo image (CRITICAL/HIGH gate)
              shell: bash
              run: |
                  trivy image \
                    --scanners vuln \
                    --severity CRITICAL,HIGH \
                    --exit-code 1 \
                    --ignorefile .trivyignore.yaml \
                    "superposition-demo:pr-${{ github.sha }}"
