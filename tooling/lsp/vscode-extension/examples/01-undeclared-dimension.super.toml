# QUICK FIX — put the cursor on `region` below, press Cmd+.
# Expect: "Declare dimension 'region' in [dimensions]"
# It picks the next free position (3) automatically.

[default-configs]
per_km_rate = { value = 20.0, schema = { type = "number", minimum = 5.0 } }

[dimensions]
city = { position = 1, schema = { type = "string", enum = ["Bangalore", "Delhi"] } }
vehicle_type = { position = 2, schema = { type = "string", enum = ["auto", "cab"] } }

[[overrides]]
_context_ = { region = "west" }
per_km_rate = 25.0
