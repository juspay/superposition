    - id: CVE-2026-73231
      paths:
          - docs/package-lock.json
      created: 2026-10-21
      expires: 2027-01-31
      statement: >-
          @faker-js/faker arbitrary code execution. Fixed only in >= 10.5.0,
          but postman-collection (used by docusaurus-plugin-openapi-docs /
          openapi-to-postmanv2) pins the 5.x API (faker.address.*), which was
          removed in faker 6+; forcing 10.x breaks the docs build. Re-evaluate
          when postman-collection supports a patched faker release.
